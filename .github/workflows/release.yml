# Every time the code on "main" changes, this packs the extension into
# PageProof.zip and puts it on the "Latest build" release page for easy download.
name: Build download

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Safety: by default every job may only READ the code. Only the "zip" job below, which runs
# after a change lands on main (never for someone else's pull request), may publish a release.
permissions:
  contents: read

jobs:
  # The automatic checks (tests/app). They start a real browser with PageProof loaded and a
  # pretend library. If any check fails, the "zip" job below does not run: nothing is released.
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Get the test browser
        run: |
          cd tests/app
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Run every check
        run: xvfb-run -a node tests/app/run.js

  zip:
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'TheBenPsych/PageProof'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pack the extension
        run: cd extension && zip -r ../PageProof.zip . -x '.*'
      # Firefox can't use Chrome's "service_worker" background yet, and Chrome shows an error
      # if the manifest also lists Firefox's "scripts". So Firefox gets its own copy of the
      # manifest with "scripts" added.
      - name: Pack the Firefox version
        run: |
          rm -rf ff && cp -r extension ff
          python3 -c "import json;p='ff/manifest.json';m=json.load(open(p));m.pop('key',None);m['background']={'scripts':['db.js','rs-store.js','fc-store.js','background.js']};m['permissions']=[x for x in m['permissions'] if x not in ('sidePanel','system.cpu','system.memory')];sp=m.pop('side_panel',None);m['sidebar_action']={'default_panel':'sidepanel.html','default_title':'PageProof'};json.dump(m,open(p,'w'),indent=2)"
          cd ff && zip -r ../PageProof-Firefox.zip . -x '.*'
      - name: Publish the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest PageProof.zip PageProof-Firefox.zip --title "Latest build" --notes "Chrome and Edge: download PageProof.zip below. Firefox: download PageProof-Firefox.zip. Then unzip it, and follow the install steps in the README."
