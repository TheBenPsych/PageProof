<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PageProof capture log</title>
<link rel="icon" href="icons/icon32.png">
<link rel="stylesheet" href="viewer.css">
<link rel="stylesheet" href="ui/tools-look.css">
<script src="theme.js"></script>
<script src="pp-guard.js"></script>
<style>
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; vertical-align: top; padding: 6px 8px; border-bottom: 1px solid rgba(127,127,127,.3); overflow-wrap: anywhere; }
  th { position: sticky; top: 0; background: var(--bg); }
  .wrap { padding: 16px; overflow-x: auto; }
  code { font-size: 11px; }
</style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="" width="32" height="32">
    <div class="who"><div id="domain">Capture log</div><div id="sub">Every page you captured with PageProof on this browser</div></div>
    <div class="buttons"><button id="csv">Download log (.csv)</button><a class="link" href="verify.html" target="_blank">Verify a pack</a></div>
  </header>
  <div class="wrap"><table>
    <thead><tr><th>Captured</th><th>Page</th><th>Case / ref</th><th>Collected by</th><th>Evidence pack saved</th><th>Pack SHA-256</th><th>Trusted timestamps</th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
  <script src="log.js"></script>
</body>
</html>
