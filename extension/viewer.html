<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PageProof capture</title>
<link rel="icon" href="icons/icon32.png">
<link rel="stylesheet" href="viewer.css">
<script src="theme.js"></script>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="" width="36" height="36">
    <div class="who">
      <div id="domain">PageProof</div>
      <div id="sub">Getting your capture ready...</div>
    </div>
    <div class="buttons">
      <button id="copy" class="ic" disabled title="Copy the whole capture as a picture, to paste into an email, chat or document"><span>📋</span>Copy</button>
      <button id="markup" class="ic" disabled title="Highlight, draw and type on a copy of this capture"><span>✏️</span>Markup</button>
      <button id="pdf" class="ic" disabled title="Download just the PDF"><span>📄</span>PDF</button>
      <button id="html" class="ic" disabled title="Download just the HTML backup"><span>🌐</span>HTML</button>
      <button id="pack" class="main big" disabled>⬇ Save evidence pack</button>
      <details class="more"><summary title="More">⋯</summary><div class="menu">
        <a href="log.html" target="_blank">📒 Capture log</a>
        <a href="batch.html" target="_blank">📚 Batch capture</a>
        <a href="verify.html" target="_blank">✅ Verify a pack</a>
      </div></details>
    </div>
  </header>
  <div id="status"></div>
  <div id="hosting" class="wb" hidden></div>
  <section id="caseBox" hidden>
    <label>Collected by <input id="collector" autocomplete="name"></label>
    <label>Case / reference number <input id="caseRef"></label>
    <label class="wide">Notes <textarea id="caseNotes" rows="2" placeholder="For example: infringing use of client photo on product page"></textarea></label>
  </section>
  <details id="detailsBox" hidden><summary>Capture details and fingerprints</summary><pre id="details"></pre></details>
  <main id="preview"></main>
  <script src="db.js"></script>
  <script src="pdf.js"></script>
  <script src="zip.js"></script>
  <script src="archive.js"></script>
  <script src="tsa.js"></script>
  <script src="hosting.js"></script>
  <script src="readme-template.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
