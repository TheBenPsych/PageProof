<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PageProof capture</title>
<link rel="icon" href="icons/icon32.png">
<link rel="stylesheet" href="viewer.css">
<link rel="stylesheet" href="ui/tools-look.css">
<script src="theme.js"></script>
<script src="pp-guard.js"></script>
<script src="ui/tool-icons.js" defer></script>
</head>
<body class="with-side">
  <aside id="side">
    <div class="brand"><img src="icons/icon48.png" alt="" width="22" height="22"> PageProof</div>
    <div class="site">
      <div id="domain">Getting ready...</div>
      <div id="url" class="url" title=""></div>
      <div id="sub"></div>
    </div>

    <ul id="proof" aria-label="What this capture proves">
      <li id="pfPage" class="wait"><i></i><span>Capturing the whole page</span></li>
      <li id="pfPics" class="wait"><i></i><span>Saving the pictures</span></li>
      <li id="pfPrint" class="wait"><i></i><span>Making fingerprints</span></li>
      <li id="pfStamp" class="wait"><i></i><span>Getting trusted timestamps</span></li>
      <li id="pfOurs" class="wait" hidden><i></i><span>Looking for your photo on the capture</span></li>
    </ul>

    <div id="warnBox" class="ppwarn bad" role="alert" hidden></div>

    <section id="caseBox" hidden>
      <h3><b class="stepn">1</b> Case details</h3>
      <label>Case / reference number <input id="caseRef"></label>
      <label>Notes <textarea id="caseNotes" rows="2" placeholder="e.g. client photo used on product page"></textarea></label>
      <label>Collected by <input id="collector" autocomplete="name"></label>
    </section>

    <section id="saveBox">
      <h3><b class="stepn">2</b> Save</h3>
      <div id="checkBox" class="ppwarn" role="alert" hidden></div>
      <button id="pack" class="main save" disabled data-why="Still getting the capture ready (stitching, pictures, fingerprints, timestamps). This takes a few seconds.">⬇ Save evidence pack</button>
      <div class="grid">
        <button id="copy" class="tile" disabled data-why="Still getting the capture ready (stitching, pictures, fingerprints, timestamps). This takes a few seconds." title="Copy the whole capture as a picture, to paste into an email, chat or document"><span>📋</span>Copy</button>
        <button id="markup" class="tile" disabled data-why="Still getting the capture ready (stitching, pictures, fingerprints, timestamps). This takes a few seconds." title="Highlight, draw and type on a copy of this capture"><span>✏️</span>Markup</button>
        <button id="pdf" class="tile" disabled data-why="Still getting the capture ready (stitching, pictures, fingerprints, timestamps). This takes a few seconds." title="Download just the PDF"><span>📄</span>PDF</button>
        <button id="html" class="tile" disabled data-why="Still getting the capture ready (stitching, pictures, fingerprints, timestamps). This takes a few seconds." title="Download just the HTML backup"><span>🌐</span>HTML</button>
      </div>
    </section>

    <details id="hosting" class="fold" hidden></details>
    <details id="detailsBox" class="fold" hidden><summary>🔍 Capture details and fingerprints</summary><pre id="details"></pre></details>

    <nav class="links" id="themeSlot">
      <a href="app.html#library" target="_blank">📒 Evidence library</a>
      <a href="verify.html" target="_blank">✅ Verify a pack</a>
    </nav>
  </aside>

  <div id="content">
    <div id="status"></div>
    <main id="preview"></main>
  </div>
  <script src="db.js"></script>
  <script src="pdf.js"></script>
  <script src="zip.js"></script>
  <script src="archive.js"></script>
  <script src="tsa.js"></script>
  <script src="hosting.js"></script>
  <script src="readme-template.js"></script>
  <script src="checker.js"></script>
  <script src="meta.js"></script>
  <script src="report.js"></script>
  <script src="viewer.js"></script>
<script src="ui/why.js"></script>
</body>
</html>
