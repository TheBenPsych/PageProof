<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PageProof capture</title>
<link rel="icon" href="icons/icon32.png">
<link rel="stylesheet" href="viewer.css">
<script src="theme.js"></script>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="" width="32" height="32">
    <div class="who">
      <div id="domain">PageProof</div>
      <div id="sub">Getting your capture ready...</div>
    </div>
    <div class="buttons">
      <button id="pack" class="main" disabled>Download evidence pack (.zip)</button>
      <button id="pdf" disabled>Download PDF</button>
      <button id="html" disabled>Download HTML backup</button>
      <a class="link" href="log.html" target="_blank">Capture log</a>
      <a class="link" href="batch.html" target="_blank">Batch capture</a>
      <a class="link" href="verify.html" target="_blank">Verify a pack</a>
    </div>
  </header>
  <div id="status"></div>
  <div id="wayback" hidden></div>
  <div id="hosting" class="wb" hidden></div>
  <section id="caseBox" hidden>
    <label>Collected by <input id="collector" autocomplete="name"></label>
    <label>Case / reference number <input id="caseRef"></label>
    <label class="wide">Notes <textarea id="caseNotes" rows="2" placeholder="For example: infringing use of client photo on product page"></textarea></label>
  </section>
  <details id="detailsBox" hidden><summary>Capture details and fingerprints</summary><pre id="details"></pre></details>
  <main id="preview"></main>
  <script src="db.js"></script>
  <script src="pdf.js"></script>
  <script src="zip.js"></script>
  <script src="archive.js"></script>
  <script src="tsa.js"></script>
  <script src="wayback.js"></script>
  <script src="hosting.js"></script>
  <script src="readme-template.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
