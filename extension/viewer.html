<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PageProof capture</title>
<link rel="icon" href="icons/icon32.png">
<link rel="stylesheet" href="viewer.css">
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="" width="32" height="32">
    <div class="who">
      <div id="domain">PageProof</div>
      <div id="sub">Getting your capture ready...</div>
    </div>
    <div class="buttons">
      <button id="pack" class="main" disabled>Download evidence pack (.zip)</button>
      <button id="png" disabled>Download PNG</button>
      <button id="pdf" disabled>Download PDF</button>
      <button id="html" disabled>Download HTML backup</button>
    </div>
  </header>
  <div id="status"></div>
  <details id="detailsBox" hidden><summary>Capture details and fingerprints</summary><pre id="details"></pre></details>
  <main id="preview"></main>
  <script src="db.js"></script>
  <script src="pdf.js"></script>
  <script src="zip.js"></script>
  <script src="archive.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
