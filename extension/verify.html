<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PageProof: verify a pack</title>
<link rel="icon" href="icons/icon32.png">
<link rel="stylesheet" href="viewer.css">
<link rel="stylesheet" href="ui/tools-look.css">
<link rel="stylesheet" href="ui/page-look.css">
<link rel="stylesheet" href="ui/win11.css">
<link rel="stylesheet" href="ui/calm-search.css">
<link rel="stylesheet" href="ui/calm-tools.css">
<script src="theme.js"></script>
<script src="pp-guard.js"></script>
<style>
  .wrap { max-width: 900px; margin: 0 auto; padding: 16px; }
  .drop { cursor: pointer; padding: 32px 16px !important; }
  .drop.over { border-color: var(--p-accent); background: var(--p-accent-soft); }
  .drop strong { font-size: 18px; }
  .verdict { margin: 18px 0 8px; padding: 16px; border-radius: 12px; font-size: 18px; font-weight: 700; }
  .verdict.good { background: var(--p-ok-soft); color: var(--p-ok); border: 1px solid color-mix(in srgb, var(--p-ok) 35%, transparent); display: flex; gap: 14px; align-items: center; font-size: 20px; }
  .verdict.good::before { content: "\2713"; flex-shrink: 0; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--p-ok); color: #fff; font-size: 24px; }
  .verdict.good .vt small { color: var(--p-ink); opacity: .8; }
  .vmain { max-width: 900px; width: 100%; margin: 0 auto; padding: 28px 24px 48px !important; box-sizing: border-box; display: flex; flex-direction: column; align-items: stretch !important; gap: 16px !important; }
  .vmain .pg-head h1 { font-size: 28px; margin: 0; }
  #out { display: flex; flex-direction: column; gap: 4px; }
  #out ul.checks { background: var(--p-surface); border: 1px solid var(--p-line); border-radius: 14px; padding: 4px 16px; }
  #out ul.checks li:last-child { border-bottom: 0; }
  .verdict.bad { background: rgba(225,29,72,.14); color: #be123c; }
  .verdict.warn { background: rgba(234,179,8,.18); color: #a16207; }
  :root[data-theme="dark"] .verdict.good { color: #4ade80; }
  :root[data-theme="dark"] .verdict.bad { color: #fb7185; }
  :root[data-theme="dark"] .verdict.warn { color: #facc15; }
  .verdict small { display: block; font-weight: 400; font-size: 14px; margin-top: 4px; }
  ul.checks { list-style: none; padding: 0; margin: 0; }
  ul.checks li { padding: 8px 0; border-bottom: 1px solid rgba(127,127,127,.25); overflow-wrap: anywhere; font-size: 14px; }
  .ok::before { content: "\2713"; display: inline-grid; place-items: center; width: 18px; height: 18px; margin-right: 8px; border-radius: 50%; background: var(--p-ok-soft); color: var(--p-ok); font-weight: 700; font-size: 12px; }
  .no::before { content: "\2716  "; color: #e11d48; font-weight: 700; }
  .info::before { content: "\2139  "; color: #2563eb; font-weight: 700; }
  h2 { font-size: 16px; margin: 22px 0 6px; }
  code { font-size: 12px; }
  .folderbtn { display: inline-block; padding: 6px 12px; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
</style>
</head>
<body class="plain">
  <div id="content"><main id="main" class="vmain">
    <div class="pg-head"><div><h1>Verify a pack</h1><p>Check that an evidence pack hasn't been changed since it was made.</p></div></div>
    <section class="pg-card" style="display:flex;flex-direction:column;gap:12px">
    <label class="drop pg-drop" id="drop">
      <strong>Drop a PageProof evidence pack (.zip) here</strong>
      <span>or click to choose one. You can also drop any single file to see its fingerprint.</span>
      <input type="file" id="pick" hidden>
    </label>
    <p style="text-align:center;margin:0" class="pg-muted">Already unzipped? <label class="pg-btn sm">Choose the unzipped folder<input type="file" id="pickFolder" webkitdirectory multiple hidden></label></p>
    </section>
    <div id="out"></div>
  </main></div>
  <script src="unzip.js"></script>
  <script src="tsverify.js"></script>
  <script src="verify.js"></script>
  <script src="ui/tool-kit.js"></script>
  <script src="ui/verify-calm.js"></script>
</body>
</html>
