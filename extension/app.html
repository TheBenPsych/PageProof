<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PageProof</title>
<link rel="icon" href="icons/icon32.png">
<script src="theme.js"></script>
<link rel="stylesheet" href="ui/app.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="PageProof menu"></aside>
  <div class="main">
    <header class="top">
      <button class="btn menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
      <div class="crumb" id="crumb" hidden></div>
      <label class="search" id="topSearch"><span id="topSearchIc"></span><input id="ppSearch" type="search" placeholder="Search sites, photos or clients" aria-label="Search sites, photos or clients"></label>
      <div class="topr">
        <div class="undo-wrap"><button class="btn tb" id="undoBtn" title="Undo your last answer (U)" disabled></button><div class="tmenu" id="undoMenu" hidden></div></div>
        <button class="btn tb icon" id="keysBtn" aria-label="Keyboard keys" title="Keyboard keys (?)"></button>
        <button class="btn tb icon" id="themeBtn" aria-label="Switch between light and dark"></button>
        <a class="btn tb go" id="capBtn" href="#capture"></a>
      </div>
    </header>
    <main class="content" id="view"></main>
    <div class="content" id="live" style="display:none"></div>
    <div class="statusline" id="statusLine" role="status" aria-label="PageProof status" hidden></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="hidLoad" accept=".txt,text/plain" hidden>
<script src="ui/icons.js"></script>
<script src="ui/shell.js"></script>
<script src="db.js"></script>
<script src="rs-store.js"></script>
<script src="ui/hardware.js"></script>
<script src="meta.js"></script>
<script src="pdf.js"></script>
<script src="rs-job.js"></script>
<script src="social.js"></script>
<script src="fc-store.js"></script>
<script src="checks.js"></script>
<script src="evidence.js"></script>
<script src="app.js"></script>
<script src="ui/fc-found.js"></script>
<script src="ui/fc-social.js"></script>
<script src="ui/fc-previews.js"></script>
<script src="ui/fc-photos.js"></script>
<script src="ui/fc-owners.js"></script>
<script src="ui/fc-bn.js"></script>
<script src="ui/newlook.js"></script>
<script src="unzip.js"></script>
<script src="ui/fc-health.js"></script>
<script src="ui/keys.js"></script>
</body>
</html>
